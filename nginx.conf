server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml image/webp application/wasm;

    # Cache static assets (hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Collection Yu-Gi-Oh : lue en direct dans Cote (service interne du cluster), repli sur le
    # fichier du dépôt si Cote ne répond pas. Variable + resolver : nginx démarre même sans Cote.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    location = /yugioh/collection.csv {
        set $cote_vitrine "${COTE_VITRINE_URL}";
        proxy_pass $cote_vitrine;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        proxy_hide_header Cache-Control;
        error_page 301 302 303 307 308 400 401 403 404 429 500 501 502 503 504 = @yugioh_local;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
    location @yugioh_local {
        try_files /yugioh/collection.csv =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # CSV files — no cache for fresh collection data
    location ~* \.csv$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.ygoprodeck.com data:; connect-src 'self' https://db.ygoprodeck.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    error_page 404 /index.html;
}
